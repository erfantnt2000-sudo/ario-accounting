{% extends "base.html" %}
{% block title %}{% if customer %}ویرایش{% else %}افزودن{% endif %} مشتری{% endblock %}
{% block page_title %}<strong>{% if customer %}ویرایش مشتری{% else %}مشتری جدید{% endif %}</strong>{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
    <form method="post">
        <div class="form-row">
            <div class="form-group">
                <label>کد</label>
                <input type="text" name="code" class="form-control" value="{{ customer.code if customer else '' }}">
            </div>
            <div class="form-group">
                <label>نام *</label>
                <input type="text" name="name" class="form-control" required value="{{ customer.name if customer else '' }}">
            </div>
        </div>
        <div class="form-group">
            <label>تلفن</label>
            <input type="text" name="phone" class="form-control" value="{{ customer.phone if customer else '' }}">
        </div>
        <div class="form-group">
            <label>آدرس</label>
            <textarea name="address" class="form-control" rows="2">{{ customer.address if customer else '' }}</textarea>
        </div>
        <div class="form-group">
            <label>یادداشت</label>
            <textarea name="notes" class="form-control" rows="2">{{ customer.notes if customer else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">ذخیره</button>
        <a href="{{ url_for('customers') }}" class="btn btn-secondary">انصراف</a>
    </form>
</div>
{% endblock %}

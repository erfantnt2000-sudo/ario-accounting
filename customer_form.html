{% extends "base.html" %}
{% block title %}{% if account %}ویرایش{% else %}افزودن{% endif %} حساب | حسابداری آریو{% endblock %}
{% block page_title %}<strong>{% if account %}ویرایش حساب{% else %}حساب جدید{% endif %}</strong>{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
    <form method="post">
        <div class="form-group">
            <label>کد حساب *</label>
            <input type="text" name="code" class="form-control" required
                   value="{{ account.code if account else '' }}"
                   {% if account %}readonly{% endif %} placeholder="مثال: 11103">
        </div>
        <div class="form-group">
            <label>نام حساب *</label>
            <input type="text" name="name" class="form-control" required value="{{ account.name if account else '' }}">
        </div>
        <div class="form-group">
            <label>حساب والد</label>
            <select name="parent_code" class="form-control">
                <option value="">— بدون والد —</option>
                {% for p in parents %}
                <option value="{{ p.code }}" {% if account and account.parent_code == p.code %}selected{% endif %}>
                    {{ p.code }} — {{ p.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>نوع حساب</label>
            <select name="account_type" class="form-control">
                <option value="asset" {% if account and account.account_type=='asset' %}selected{% endif %}>دارایی</option>
                <option value="liability" {% if account and account.account_type=='liability' %}selected{% endif %}>بدهی</option>
                <option value="equity" {% if account and account.account_type=='equity' %}selected{% endif %}>حقوق صاحبان سهام</option>
                <option value="revenue" {% if account and account.account_type=='revenue' %}selected{% endif %}>درآمد</option>
                <option value="expense" {% if account and account.account_type=='expense' %}selected{% endif %}>هزینه</option>
            </select>
        </div>
        <div class="form-group">
            <label>توضیحات</label>
            <textarea name="description" class="form-control" rows="2">{{ account.description if account else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">ذخیره</button>
        <a href="{{ url_for('accounts') }}" class="btn btn-secondary">انصراف</a>
    </form>
</div>
{% endblock %}
